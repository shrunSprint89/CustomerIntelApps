name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

  lint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Yarn install
        run: yarn install --ignore-scripts || npm install
      - name: Lint
        run: cd web && npm ci && npm run lint

  typecheck:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Yarn install
        run: yarn install --ignore-scripts || npm install
      - name: Typecheck (stub)
        run: cd web && echo "TypeScript is installed, add typecheck script as needed"

  test:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Yarn install
        run: yarn install --ignore-scripts || npm install
      - name: Test (stub)
        run: cd web && echo "Add test script as needed"

  netlify_deploy:
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install Netlify CLI
        run: npm install -g netlify-cli
      - name: Netlify deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: cd web && netlify deploy --build --prod --auth $NETLIFY_AUTH_TOKEN

  supabase_deploy:
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: Supabase deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: cd supabase && supabase functions deploy --project-ref local
