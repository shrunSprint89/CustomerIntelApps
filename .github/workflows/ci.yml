name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

  lint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Yarn install
        run: yarn install --ignore-scripts || npm install
      - name: Lint (placeholder)
        run: echo "No lint script yet" # replace with real lint

  typecheck:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Yarn install
        run: yarn install --ignore-scripts || npm install
      - name: Typecheck (placeholder)
        run: echo "No typecheck script yet" # replace with real typecheck

  test:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Yarn install
        run: yarn install --ignore-scripts || npm install
      - name: Test (placeholder)
        run: echo "No tests yet" # replace with real test command

  netlify_deploy:
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Netlify deploy (stub)
        run: echo "Setup Netlify CLI deploy here"

  supabase_deploy:
